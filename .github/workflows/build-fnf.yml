
name: Build FNF ChatGPT Version

on:
  workflow_dispatch:
  push:
    paths:
      - 'fnf-chatgpt-version-source.zip'
      - '.github/workflows/build-fnf.yml'

permissions:
  contents: read

concurrency:
  group: fnf-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-24.04
    timeout-minutes: 180

    defaults:
      run:
        shell: bash

    env:
      GAME_DIR: FNF-ChatGPT-Version
      GIT_TERMINAL_PROMPT: '0'

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Extract FNF ZIP
        run: |
          set -Eeuo pipefail
          mkdir -p ci-logs
          exec > >(tee ci-logs/01-extract.log) 2>&1

          test -f fnf-chatgpt-version-source.zip || {
            echo "::error::Source ZIP missing"
            exit 1
          }

          unzip -tq fnf-chatgpt-version-source.zip

          python3 - <<'PY'
          from pathlib import PurePosixPath
          from zipfile import ZipFile

          with ZipFile("fnf-chatgpt-version-source.zip") as z:
              for info in z.infolist():
                  p = PurePosixPath(info.filename)

                  if (
                      p.is_absolute()
                      or ".." in p.parts
                      or not p.parts
                      or p.parts[0] != "FNF-ChatGPT-Version"
                  ):
                      raise SystemExit(
                          "Unsafe ZIP path: " + info.filename
                      )

                  mode = info.external_attr >> 16
                  if (mode & 0o170000) == 0o120000:
                      raise SystemExit(
                          "ZIP symlink rejected: " + info.filename
                      )
          PY

          unzip -q fnf-chatgpt-version-source.zip

          test -f "$GAME_DIR/project.hxp"
          test -f "$GAME_DIR/hmm.json"

          if test -f "$GAME_DIR/tests/test_chatgpt_patch.py"; then
            python3 "$GAME_DIR/tests/test_chatgpt_patch.py"
          fi

          echo "Source extracted successfully"

      - name: Install Linux dependencies
        run: |
          set -Eeuo pipefail
          exec > >(tee ci-logs/02-linux.log) 2>&1

          sudo apt-get update -qq

          sudo DEBIAN_FRONTEND=noninteractive \
            apt-get install -y --no-install-recommends \
            git \
            git-lfs \
            unzip \
            zip \
            build-essential \
            pkg-config \
            cmake \
            python3 \
            libx11-dev \
            libxi-dev \
            libxext-dev \
            libxinerama-dev \
            libxrandr-dev \
            libxcursor-dev \
            libgl1-mesa-dev \
            libglu1-mesa-dev \
            libasound2-dev \
            libpulse-dev \
            libvlc-dev \
            libvlccore-dev

          git lfs version

      - name: Install Haxe 4.3.7
        uses: FunkinCrew/ci-haxe@v3
        with:
          haxe-version: '4.3.7'

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4

      - name: Install Android SDK and NDK
        run: |
          set -Eeuo pipefail
          exec > >(tee ci-logs/03-sdk.log) 2>&1

          : "${ANDROID_SDK_ROOT:?Android SDK missing}"

          sdkmanager --install \
            'build-tools;35.0.0' \
            'platforms;android-29' \
            'platforms;android-35' \
            'ndk;29.0.13113456'

          echo "ANDROID_NDK_ROOT=$ANDROID_SDK_ROOT/ndk/29.0.13113456" >> "$GITHUB_ENV"
          echo "ANDROID_NDK_HOME=$ANDROID_SDK_ROOT/ndk/29.0.13113456" >> "$GITHUB_ENV"
          echo "ANDROID_HOME=$ANDROID_SDK_ROOT" >> "$GITHUB_ENV"

          java -version

      - name: Configure Haxe libraries
        working-directory: FNF-ChatGPT-Version
        run: |
          set -Eeuo pipefail
          exec > >(tee ../ci-logs/04-haxe.log) 2>&1

          haxe -version

          haxelib fixrepo --global || true

          haxelib --never --global install haxelib 4.1.0
          haxelib --global set haxelib 4.1.0

          haxelib --global remove haxelib git || true
          haxelib --global remove hmm || true

          haxelib --never --global git haxelib \
            https://github.com/FunkinCrew/haxelib.git \
            funkin-patches \
            --skip-dependencies

          haxelib --never --global git hmm \
            https://github.com/FunkinCrew/hmm.git \
            funkin-patches

          haxelib --never newrepo

          echo "HAXEPATH=$(haxelib config)" >> "$GITHUB_ENV"

      - name: Cache Haxe dependencies
        id: cache-haxe
        uses: actions/cache@v4
        with:
          path: FNF-ChatGPT-Version/.haxelib
          key: fnf-haxe-${{ runner.os }}-${{ hashFiles('fnf-chatgpt-version-source.zip') }}

      - name: Install game libraries
        if: steps.cache-haxe.outputs.cache-hit != 'true'
        working-directory: FNF-ChatGPT-Version
        run: |
          set -Eeuo pipefail
          exec > >(tee ../ci-logs/05-libraries.log) 2>&1

          haxelib --global run hmm install -q

          test -d .haxelib/hxcpp/git || {
            echo "::error::hxcpp missing"
            exit 1
          }

          haxelib list

      - name: Compile HXCPP
        working-directory: FNF-ChatGPT-Version
        run: |
          set -Eeuo pipefail
          exec > >(tee ../ci-logs/06-hxcpp.log) 2>&1

          cd .haxelib/hxcpp/git/tools/hxcpp
          haxe compile.hxml

      - name: Download FNF assets
        working-directory: FNF-ChatGPT-Version
        run: |
          set -Eeuo pipefail
          exec > >(tee ../ci-logs/07-assets.log) 2>&1

          rm -rf assets art

          git lfs install --skip-repo

          GIT_LFS_SKIP_SMUDGE=1 git clone \
            --depth 1 \
            --branch main \
            https://github.com/FunkinCrew/funkin.assets.git \
            assets

          git -C assets lfs pull

          test -d assets/preload || {
            echo "::error::Game assets missing"
            exit 1
          }

          GIT_LFS_SKIP_SMUDGE=1 git clone \
            --depth 1 \
            --filter=blob:none \
            --sparse \
            --branch main \
            https://github.com/FunkinCrew/funkin.art.git \
            art

          git -C art sparse-checkout set icons
          git -C art lfs pull --include='icons/**'

          test -f art/readme.txt || {
            echo "::error::Art readme missing"
            exit 1
          }

          test -d art/icons/android || {
            echo "::error::Android icons missing"
            exit 1
          }

          echo "Assets and artwork downloaded"

      - name: Configure Lime for Android
        working-directory: FNF-ChatGPT-Version
        run: |
          set -Eeuo pipefail
          exec > >(tee ../ci-logs/08-config.log) 2>&1

          haxelib run lime config ANDROID_SDK "$ANDROID_SDK_ROOT"
          haxelib run lime config ANDROID_NDK_ROOT "$ANDROID_NDK_ROOT"
          haxelib run lime config JAVA_HOME "$JAVA_HOME"

          haxelib run lime rebuild android

      - name: Build FNF ChatGPT APK
        working-directory: FNF-ChatGPT-Version
        run: |
          set -Eeuo pipefail
          exec > >(tee ../ci-logs/09-build.log) 2>&1

          haxelib run lime build android \
            -release \
            -DEXCLUDE_ARMV7 \
            -verbose

      - name: Find and sign APK
        working-directory: FNF-ChatGPT-Version
        run: |
          set -Eeuo pipefail
          exec > >(tee ../ci-logs/10-package.log) 2>&1

          mkdir -p ../fnf-artifact

          mapfile -d '' apks < <(
            find export -type f -name '*.apk' -print0
          )

          if (( ${#apks[@]} == 0 )); then
            echo "::error::No APK produced"
            exit 1
          fi

          apk="${apks[0]}"
          tools="$ANDROID_SDK_ROOT/build-tools/35.0.0"

          if "$tools/apksigner" verify "$apk" >/dev/null 2>&1; then
            cp "$apk" \
              ../fnf-artifact/FNF-ChatGPT-Version.apk
          else
            "$tools/zipalign" -f -p 4 \
              "$apk" \
              ../fnf-artifact/aligned.apk

            keytool -genkeypair -noprompt \
              -keystore ../fnf-artifact/test-key.jks \
              -storepass temporary-ci-only \
              -keypass temporary-ci-only \
              -alias ci \
              -keyalg RSA \
              -keysize 3072 \
              -validity 30 \
              -dname "CN=FNF Test Build,O=Personal Build,C=GB"

            "$tools/apksigner" sign \
              --ks ../fnf-artifact/test-key.jks \
              --ks-key-alias ci \
              --ks-pass pass:temporary-ci-only \
              --key-pass pass:temporary-ci-only \
              --out ../fnf-artifact/FNF-ChatGPT-Version.apk \
              ../fnf-artifact/aligned.apk

            rm -f \
              ../fnf-artifact/test-key.jks \
              ../fnf-artifact/aligned.apk
          fi

          "$tools/apksigner" verify \
            ../fnf-artifact/FNF-ChatGPT-Version.apk

          ls -lh ../fnf-artifact/FNF-ChatGPT-Version.apk

      - name: Upload FNF ChatGPT APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: FNF-ChatGPT-Version-Android-APK
          path: fnf-artifact/FNF-ChatGPT-Version.apk
          if-no-files-found: error
          retention-days: 14

      - name: Upload build logs even if failed
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: FNF-ChatGPT-Version-Build-Logs
          path: ci-logs/
          if-no-files-found: warn
          retention-days: 14
